<!doctype html><meta charset="utf-8">
<style>
  /* Work page card for MTB Pay Merchant: the corner of a phone, its app in the dock.
     Rim layers and proportions are measured from the reference shot, at 3x. */
  html, body { margin: 0; }
  .stage { position: relative; width: 1300px; height: 1200px; overflow: hidden; background: linear-gradient(115deg, #f4f4f4, #ededed 50%, #e2e2e2); }
  .ring { position: absolute; }
  .phone {
    left: 126px; top: -530px; width: 1560px; height: 1474px; border-radius: 296px; background: #6c6c6a;
    box-shadow: 10px 46px 110px -8px rgba(0, 0, 0, 0.3), 0 8px 26px rgba(0, 0, 0, 0.1);
  }
  .steel { inset: 2px; border-radius: 294px; background: linear-gradient(120deg, #e4e4e0, #d8d9d4 45%, #e9e9e5); }
  .seam { inset: 11px; border-radius: 285px; background: #747572; }
  .band { inset: 13px; border-radius: 283px; background: linear-gradient(120deg, #aaaba5, #9ea09a 50%, #b0b1ab); }
  .black { inset: 23px; border-radius: 273px; background: #010005; }
  .screen { inset: 91px; border-radius: 208px; overflow: hidden; background: #e9c98f; }
  .wall { position: absolute; inset: 0; width: 100%; height: 100%; }
  .dock {
    position: absolute; left: 153px; bottom: 171px; width: 1400px; height: 438px; border-radius: 92px;
    background: rgba(255, 255, 255, 0.27); backdrop-filter: blur(44px) saturate(1.3);
    box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.16);
  }
  .tile { position: absolute; top: 66px; width: 306px; height: 306px; border-radius: 72px; overflow: hidden; }
  @supports (corner-shape: squircle) { .tile { border-radius: 116px; corner-shape: squircle; } }
  .mtb { left: 51px; background: #d10a10; }
  .mtb img { display: block; width: 100%; height: 100%; transform: scale(1.04); }
  .mtb::after { content: ''; position: absolute; inset: 0; background: linear-gradient(165deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0) 42%, rgba(70, 0, 10, 0.16)); }
  .facetime { left: 408px; background: linear-gradient(180deg, #a6ef95, #8fdf80 45%, #76c96a); }
  .facetime svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .blue { left: 765px; background: linear-gradient(180deg, #7fd0ff, #2a86ea); }
</style>
<div class="stage">
  <div class="ring phone"><div class="ring steel"></div><div class="ring seam"></div><div class="ring band"></div><div class="ring black"></div>
  <div class="ring screen">
    <!-- In the style of iOS 27's light wallpaper: folded petals, sandy gold into soft purple. -->
    <svg class="wall" viewBox="0 0 1470 1384" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3dcae" /><stop offset="0.55" stop-color="#e2bd8c" /><stop offset="1" stop-color="#b79ad0" /></linearGradient>
        <linearGradient id="p1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8e6c0" /><stop offset="1" stop-color="#dcae74" /></linearGradient>
        <linearGradient id="p2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0cf96" /><stop offset="0.6" stop-color="#d9a98a" /><stop offset="1" stop-color="#b08cc4" /></linearGradient>
        <linearGradient id="p3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ecc58f" /><stop offset="0.5" stop-color="#c9a0b4" /><stop offset="1" stop-color="#9478c8" /></linearGradient>
        <linearGradient id="p4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3b9a0" /><stop offset="0.55" stop-color="#b394cd" /><stop offset="1" stop-color="#7f66bf" /></linearGradient>
        <linearGradient id="p5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9b0b8" /><stop offset="1" stop-color="#8a70c8" /></linearGradient>
        <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="-10" dy="22" stdDeviation="34" flood-color="#5a3a6e" flood-opacity="0.34" /></filter>
      </defs>
      <rect width="1470" height="1384" fill="url(#bg)" />
      <path filter="url(#s)" fill="url(#p1)" d="M-60 300 C 240 120 620 260 760 640 C 860 920 700 1240 420 1460 L -60 1460 Z" />
      <path filter="url(#s)" fill="url(#p2)" d="M1560 -40 C 1120 40 620 330 470 760 C 380 1020 430 1260 560 1460 L 1560 1460 Z" />
      <path filter="url(#s)" fill="url(#p3)" d="M1560 330 C 1180 340 800 560 680 880 C 600 1100 650 1300 760 1460 L 1560 1460 Z" />
      <path filter="url(#s)" fill="url(#p4)" d="M-60 930 C 240 780 640 830 880 1060 C 1000 1180 1060 1320 1080 1460 L -60 1460 Z" />
      <path filter="url(#s)" fill="url(#p5)" d="M1560 800 C 1300 830 1080 980 1000 1180 C 960 1280 960 1380 980 1460 L 1560 1460 Z" />
    </svg>
    <div class="dock">
      <div class="tile mtb"><img src="mtb-icon.png" alt=""></div>
      <div class="tile facetime">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <linearGradient id="fb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4faf0" /><stop offset="0.3" stop-color="#ffffff" /><stop offset="0.56" stop-color="#fbfbfa" /><stop offset="0.8" stop-color="#e2e4e0" /><stop offset="1" stop-color="#c3c8c1" /></linearGradient>
            <linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf8e4" /><stop offset="0.5" stop-color="#f4f5f2" /><stop offset="0.8" stop-color="#dcdfda" /><stop offset="1" stop-color="#c9ecbe" /></linearGradient>
            <filter id="b1" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.7" /></filter>
            <filter id="b2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4" /></filter>
            <clipPath id="fc"><rect x="13.4" y="25.5" width="52" height="49.5" rx="9.5" /></clipPath>
          </defs>
          <rect x="13.4" y="28" width="52" height="49.5" rx="9.5" fill="#2f8f35" opacity="0.32" filter="url(#b2)" />
          <path d="M71 46.5 L83 34.5 V66.5 L71 56.5 Z" transform="translate(0 2.2)" fill="#2f8f35" opacity="0.28" filter="url(#b2)" />
          <rect x="13.4" y="25.5" width="52" height="49.5" rx="9.5" fill="#c6f1ba" />
          <g clip-path="url(#fc)"><rect x="15.4" y="27" width="48" height="46" rx="8" fill="url(#fb)" filter="url(#b1)" /></g>
          <path d="M71 46.5 L83 34.5 V66.5 L71 56.5 Z" fill="#c9f0bd" stroke="#c9f0bd" stroke-width="6" stroke-linejoin="round" />
          <path d="M71 46.5 L83 34.5 V66.5 L71 56.5 Z" fill="url(#fl)" stroke="url(#fl)" stroke-width="3" stroke-linejoin="round" filter="url(#b1)" />
        </svg>
      </div>
      <div class="tile blue"></div>
    </div>
  </div></div>
</div>
