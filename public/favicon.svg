<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Sai Myo Thu: an "S" on the site's mountain blue, with the glass buttons' sheen -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#5b8fe8"/>
      <stop offset="0.55" stop-color="#2a56b3"/>
      <stop offset="1" stop-color="#0f2560"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#sheen)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.5" fill="none" stroke="#bed6ff" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="32" y="46.5" text-anchor="middle" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="42" fill="#fff">S</text>
</svg>
